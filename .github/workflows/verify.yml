name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned dependency manager
        run: python -m pip install uv==0.12.9
      - name: Check and install locked development dependencies
        run: |
          uv lock --project backend --check
          uv sync --project backend --frozen --extra dev
      - name: Lint backend
        run: uv run --project backend --frozen --extra dev ruff check backend
      - name: Check Python tooling for errors
        run: uv run --project backend --frozen --extra dev ruff check --select F scripts tests .codex/hooks
      - name: Test backend
        run: uv run --project backend --frozen --extra dev pytest backend/tests -q

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check the root documents, the mark and the motion GIFs
        run: python docs/readme/check_readme.py

  review-tooling:
    name: Review tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test the review runner, PR policy and check selection with synthetic fixtures
        run: |
          python -m unittest discover -s tests -p test_review_regress.py -v
          python -m unittest discover -s tests -p test_pr_policy.py -v
          python -m unittest discover -s tests -p test_review_checks.py -v
      # The real findings ledger and independent review still require approval.

  agent-config:
    name: Agent config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check Claude skills, rules and Jira flow, Codex JSON and branch-protection names
        run: python scripts/check_agent_config.py
      - name: Test the agent-config check and the Claude skills
        run: |
          python -m unittest discover -s tests -p test_agent_config.py -v
          python -m unittest discover -s tests -p test_claude_review_skills.py -v
          python -m unittest discover -s tests -p test_claude_workflow_skills.py -v

  static-preview:
    name: Static preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build and check the architecture atlas
        working-directory: site
        run: |
          npm ci
          npm run build
          npm run check
      - name: Check preview document and local links
        run: python -m unittest discover -s tests -p test_site_preview.py -v

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install checksum-verified actionlint
        env:
          ACTIONLINT_ARCHIVE: actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 60 \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$ACTIONLINT_ARCHIVE" \
            --output "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$ACTIONLINT_ARCHIVE" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE" -C "$RUNNER_TEMP" actionlint
      - name: Validate all GitHub workflows
        run: '"$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml'
