name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned dependency manager
        run: python -m pip install uv==0.12.9
      - name: Check and install locked development dependencies
        run: |
          uv lock --project backend --check
          uv sync --project backend --frozen --extra dev
      - name: Lint backend
        run: uv run --project backend --frozen --extra dev ruff check backend
      - name: Check Python tooling for errors
        run: uv run --project backend --frozen --extra dev ruff check --select F scripts tests .codex/hooks .claude/hooks docs/confluence docs/planning/baseline-signoff-2026-11-03 docs/planning/story-readiness-2026-11-03
      - name: Test backend
        run: uv run --project backend --frozen --extra dev pytest backend/tests -q

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # a signed-off pack is checked against the commit the owner signed, so history must be present
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check the root documents, the mark and the motion GIFs
        run: python docs/readme/check_readme.py
      - name: Validate the reconciliation pack and the documents that link to it
        run: python docs/planning/ma-reconciliation-2026-11-02/validate.py
      - name: Every design is in step with its Claude artifact
        run: |
          python3 scripts/design_sync.py check
          python3 -m unittest discover -s tests -p test_design_sync.py -v
      - name: Design pages hold their tokens, contrast by token and motion rules; rendered checks run locally
        run: |
          python3 docs/design/journeys/build.py --check
          python3 scripts/design_gates.py check
          python3 scripts/design_gates.py selftest
          node scripts/design_journeys_facts.mjs --selftest
          node scripts/design_journeys_facts.mjs --all
          python3 scripts/design_tokens.py check
          python3 scripts/design_tokens.py selftest
          python3 -m unittest discover -s tests -p test_design_gates.py -v
          python3 -m unittest discover -s tests -p test_design_tokens.py -v
      - name: Every story is ready and every draft accounted for
        run: |
          python3 docs/planning/story-readiness-2026-11-03/stories.py check
          python3 docs/planning/story-readiness-2026-11-03/stories.py selftest
      - name: No retired fact is stated in a current document or generator
        run: |
          python3 scripts/check_retired_facts.py
          python3 scripts/check_retired_facts.py selftest
      - name: The baseline sign-off pack matches its inputs
        run: |
          python3 docs/planning/baseline-signoff-2026-11-03/build_signoff.py --check
          python3 -m unittest discover -s tests -p test_baseline_signoff.py -v

  review-tooling:
    name: Review tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Some fixed-finding checks compare with an older commit.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # Three MP-16 checks run `uv run --with numpy pandas`, so the runner needs uv; two MP-20 checks import
      # jsonschema (the version the foundation validator pins).
      - name: Install the review checks' pinned tools
        run: python -m pip install uv==0.12.9 jsonschema==4.25.1
      - name: Test the review runner, PR policy and check selection with synthetic fixtures
        run: |
          python -m unittest discover -s tests -p test_review_regress.py -v
          python -m unittest discover -s tests -p test_pr_policy.py -v
          python -m unittest discover -s tests -p test_review_checks.py -v
      - name: The regression runner's own cases
        run: python3 scripts/review_regress.py --selftest
      # Fixed stays fixed: every live check in every issue's ledger (owner, 2 Nov 2026, MP-35).
      # Exit 3 means every check passed and only checks a person makes remain.
      - name: Every fixed finding still holds
        run: |
          set +e
          python3 scripts/review_regress.py --every --jobs 4
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi
      - name: Every review state file is whole
        run: |
          for f in review/*/state.json; do
            python3 scripts/review_regress.py --state "$(basename "$(dirname "$f")")"
          done
          if [ -f review/state.json ]; then python3 scripts/review_regress.py --state LOCAL; fi

  agent-config:
    name: Agent config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check Claude skills, rules and Jira flow, Codex JSON and branch-protection names
        run: python scripts/check_agent_config.py
      - name: Test the agent-config check and the Claude skills
        run: |
          python -m unittest discover -s tests -p test_agent_config.py -v
          python -m unittest discover -s tests -p test_claude_review_skills.py -v
          python -m unittest discover -s tests -p test_claude_workflow_skills.py -v
      - name: The PR gate and edit hooks still bite
        run: |
          python .claude/hooks/mp_hook.py selftest
          python -m unittest discover -s tests -p test_mp_hook.py -v

  plan-sync:
    name: Plan sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # The whole history: removed paths count as accounted for, and the PR is compared with its base.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: The trace, the root documents, the phases and the Confluence pages agree
        run: python3 scripts/plan_sync.py check
      - name: Plan sync's own checks still bite
        run: |
          python3 scripts/plan_sync.py selftest
          python3 -m unittest discover -s tests -p test_plan_sync.py -v
      # A pull_request run checks out the PR's merge commit, detached: HEAD^1 is the base, and the
      # issue key comes from the PR's head branch; with no key it fails closed.
      - name: Every product file the PR changes belongs to its issue
        if: github.event_name == 'pull_request'
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/plan_sync.py pr-files --base HEAD^1

  confluence-receipts:
    name: Confluence receipts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: A page that comes back cut short or changed is refused
        run: |
          python3 docs/confluence/build_pages.py selftest
          python3 -m unittest discover -s tests -p test_confluence_receipts.py -v
      - name: Every page is rendered from the repo, published and read back whole
        run: python3 docs/confluence/build_pages.py check

  static-preview:
    name: Static preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build and check the architecture atlas
        working-directory: site
        run: |
          npm ci
          npm run build
          npm run check
      - name: Check preview document and local links
        run: python -m unittest discover -s tests -p test_site_preview.py -v

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install checksum-verified actionlint
        env:
          ACTIONLINT_ARCHIVE: actionlint_1.7.12_linux_amd64.tar.gz
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 60 \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$ACTIONLINT_ARCHIVE" \
            --output "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$ACTIONLINT_ARCHIVE" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$ACTIONLINT_ARCHIVE" -C "$RUNNER_TEMP" actionlint
      - name: Validate all GitHub workflows
        run: '"$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml'
