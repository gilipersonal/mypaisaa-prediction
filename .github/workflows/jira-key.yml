name: jira-key

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -qE '^\[MP-[0-9]+\] '; then
            echo '::error::PR title must start with [MP-n] followed by a space.'
            exit 1
          fi
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if ! printf '%s' "$BRANCH" | grep -qE '^MP-[0-9]+-'; then
            echo '::error::Branch must start with MP-n-.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          while IFS= read -r subject; do
            if ! printf '%s' "$subject" | grep -qE '^MP-[0-9]+: '; then
              echo '::error::Every commit subject must start with MP-n: '
              bad=1
            fi
          done < <(git log --format=%s "$BASE..$HEAD")
          exit "$bad"
