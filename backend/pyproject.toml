[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mypaisaa-prediction-api"
version = "0.1.0"
description = "Personal investment intelligence API; no trade execution."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sse-starlette>=2.1,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.0,<2.0",
  "ruff>=0.7,<1.0",
]
data = [
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
]
ml = [
  "numpy>=2.1,<3.0",
  "pandas>=2.2,<3.0",
  "scikit-learn>=1.5,<2.0",
]
agents = [
  "claude-agent-sdk>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-asyncio 1.x warns while this is unset and will change its default; each async fixture gets its own loop (MP-200)
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
