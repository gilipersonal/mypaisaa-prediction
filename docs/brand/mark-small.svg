<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-labelledby="t">
  <title id="t">Mypaisaa Prediction: a price line opens into a forecast fan, and the outcome lands inside it</title>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16244A"/><stop offset="1" stop-color="#0B1329"/>
    </linearGradient>
    <linearGradient id="fan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5A524" stop-opacity=".95"/><stop offset="1" stop-color="#F5A524" stop-opacity=".55"/>
    </linearGradient>
  </defs>
  <g class="tile">
    <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#ink)"/>
    
    <g class="fan">
      <path d="M52 68 L90.3 35.9 A50 50 0 0 1 99.6 83.5 Z" fill="url(#fan)" opacity=".5"/>
      <path d="M52 68 L97.7 47.7 A50 50 0 0 1 101.8 72.4 Z" fill="url(#fan)" opacity=".9"/>
      
    </g>
    
    <path class="hist" d="M15 89 L27 78 L36 82 L45 70 L52 68" fill="none" stroke="#F7F2E8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="now" cx="52" cy="68" r="8.5" fill="#F7F2E8" stroke="#0B1329" stroke-width="2.2"/>
    
    <circle class="hit" cx="90.6" cy="59.0" r="8" fill="#3DDC97" stroke="#0B1329" stroke-width="2"/>
  </g>
</svg>
