<rect x="565" y="511" width="6" height="80" rx="3" fill="#087D78"/>
<text x="585" y="533" font-size="22" font-weight="700" fill="#17243C">Immutable prediction</text>
<text x="585" y="561" font-size="18" font-weight="400" fill="#17243C">Target, horizon + probability</text>
<text x="585" y="585" font-size="18" font-weight="400" fill="#17243C">Cutoff + model + evidence</text>
<rect x="40" y="500" width="300" height="112" rx="18" fill="#A9B7CD"/>
<rect x="40" y="495" width="300" height="112" rx="18" fill="#DCF5EF" stroke="#087D78" stroke-width="2"/>
<rect x="55" y="511" width="6" height="80" rx="3" fill="#087D78"/>
<text x="75" y="533" font-size="22" font-weight="700" fill="#17243C">Mature outcome + score</text>
<text x="75" y="561" font-size="18" font-weight="400" fill="#17243C">Wait for forecast horizon</text>
<text x="75" y="585" font-size="18" font-weight="400" fill="#17243C">Calibration vs benchmark</text>
<path d="M40,733 H1360" stroke="#A9B7CD"/>
<text x="40" y="763" font-size="17" font-weight="700" fill="#17243C">Never random-split time series. No future leakage. Corrections append a superseding version.</text>
<text x="40" y="791" font-size="16" font-weight="400" fill="#526078">Every forecast records target, horizon, cutoff, model version, uncertainty/calibration and cited explanation.</text>
<text x="40" y="818" font-size="16" font-weight="400" fill="#526078">1 November 2026 | Conceptual flows, not live activity | Personal use only - no trading</text>
