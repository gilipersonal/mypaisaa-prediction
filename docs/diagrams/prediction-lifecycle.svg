<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">Prediction-to-outcome lifecycle</title>
<desc id="desc">A fixed data cutoff precedes purged walk-forward evaluation, with transforms and calibration fit inside each training fold. Approved model runs publish immutable predictions. Outcomes are collected only after maturity, then scored against declared benchmarks.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.flow{stroke-dasharray:11 19;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style>
<rect width="100%" height="100%" fill="#F5F7FC"/>
<text x="40" y="55" font-size="32" font-weight="700" fill="#17243C">MYPAISAA / Prediction-to-outcome lifecycle</text>
<text x="40" y="96" font-size="19" font-weight="400" fill="#526078">PLANNED SCIENTIFIC CONTROLS: retain what was known, what was predicted, and what later happened.</text>
<text x="40" y="151" font-size="16" font-weight="700" fill="#526078">01 / TIME-AWARE EVALUATION</text>
<text x="40" y="451" font-size="16" font-weight="700" fill="#526078">02 / IMMUTABLE ACCOUNTABILITY</text>
