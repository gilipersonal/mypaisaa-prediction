<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">Budget-first AWS deployment</title>
<desc id="desc">Planned single-host personal deployment uses Amazon Lightsail with reverse proxy, FastAPI, scheduled worker and local PostgreSQL. Encrypted S3 backups, CloudWatch and AWS Budgets are planned. No infrastructure has been deployed.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.flow{stroke-dasharray:11 19;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style>
