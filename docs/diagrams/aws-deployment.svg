<path d="M40,733 H1360" stroke="#A9B7CD"/>
<text x="40" y="763" font-size="17" font-weight="700" fill="#17243C">AWS target below £50/month, excluding Twelve Data and Claude API. Prices require regional confirmation.</text>
<text x="40" y="791" font-size="16" font-weight="400" fill="#526078">Single-host availability accepted. No ALB, NAT Gateway, RDS, GPU, managed Redis or automatic deployment.</text>
<text x="40" y="818" font-size="16" font-weight="400" fill="#526078">1 November 2026 | Conceptual flows, not live activity | Personal use only - no trading</text>
