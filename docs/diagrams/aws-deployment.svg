<text x="40" y="55" font-size="32" font-weight="700" fill="#17243C">MYPAISAA / Budget-first AWS deployment</text>
<text x="40" y="96" font-size="19" font-weight="400" fill="#526078">PLANNED ONLY: one small host, encrypted backups and explicit cost controls. Region is not selected.</text>
<text x="40" y="151" font-size="16" font-weight="700" fill="#526078">PERSONAL ACCESS</text>
<text x="500" y="151" font-size="16" font-weight="700" fill="#526078">PLANNED SINGLE HOST</text>
<text x="1040" y="151" font-size="16" font-weight="700" fill="#526078">PLANNED SAFEGUARDS</text>
