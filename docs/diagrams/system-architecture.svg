<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">System architecture</title>
<desc id="desc">Planned web and native clients use FastAPI. Licensed data, quantitative jobs and bounded research agents feed immutable PostgreSQL records. Encrypted backups protect durable state. No trading.</desc>
