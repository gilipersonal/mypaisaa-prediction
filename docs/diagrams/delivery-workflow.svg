<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Consent-gated delivery workflow</title>
<desc id="desc">Work starts on an MP issue branch, runs applicable gates, and asks before creating a PR. The exact head must pass CI. Explicit consent precedes merging and closure of the verified completed Jira issue, then a clean local checkout returns to main. Independent review is optional and each round requires approval. If Jira closure fails, still attempt the safe local return and report both outcomes separately.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif}.flow{stroke-dasharray:11 19;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style>
<rect width="100%" height="100%" fill="#F5F7FC"/>
<text x="40" y="55" font-size="32" font-weight="700" fill="#17243C">MYPAISAA / Consent-gated delivery workflow</text>
<text x="40" y="96" font-size="19" font-weight="400" fill="#526078">IMPLEMENTED WORKFLOW RULES: issue-linked branches, explicit shipping consent, and safe return to main.</text>
<text x="40" y="146" font-size="16" font-weight="700" fill="#526078">PREPARE</text>
<text x="40" y="356" font-size="16" font-weight="700" fill="#526078">VERIFY + ASK</text>
<text x="400" y="566" font-size="16" font-weight="700" fill="#526078">APPROVED MERGE + FOLLOW-UP</text>
