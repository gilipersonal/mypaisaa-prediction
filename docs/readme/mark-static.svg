<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="mp-light-title mp-light-desc">
  <title id="mp-light-title">Mypaisaa Prediction — Forecast Coin</title>
  <desc id="mp-light-desc">A navy pound coin, a traced orbit and a coral prediction point. The introduction plays once in 2.27 seconds; reduced motion shows the resting mark.</desc>

  <defs>
    <linearGradient id="mp-light-coin" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#243752"/><stop offset="1" stop-color="#13213A"/>
    </linearGradient>
    <filter id="mp-light-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0C1729" flood-opacity=".14"/>
    </filter>
    <mask id="mp-light-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <rect width="256" height="256" fill="white"/>
      <g class="mp-orbit"><circle cx="197.3" cy="58.7" r="19" fill="black"/></g>
    </mask>
  </defs>
  <g mask="url(#mp-light-gap)">
    <circle class="mp-ring" cx="128" cy="128" r="98" fill="none" stroke="#243752" stroke-width="5.2" transform="rotate(-90 128 128)"/>
  </g>
  <g class="mp-coin" filter="url(#mp-light-shadow)">
    <circle cx="128" cy="128" r="76" fill="url(#mp-light-coin)"/>
    <circle cx="128" cy="128" r="75.5" fill="none" stroke="white" stroke-opacity=".08"/>
    <g fill="none" stroke="#FFFCF6" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path class="mp-pound" pathLength="1" d="M149 101 C147 86 139 79 127 79 C110 79 102 91 102 106 L104 140 C104 152 99 161 91 167 L158 167"/>
      <path class="mp-pound" pathLength="1" d="M91 126 H139"/>
    </g>
  </g>
  <g class="mp-orbit"><circle class="mp-point" cx="197.3" cy="58.7" r="12.5" fill="#F86F54"/></g>
</svg>
