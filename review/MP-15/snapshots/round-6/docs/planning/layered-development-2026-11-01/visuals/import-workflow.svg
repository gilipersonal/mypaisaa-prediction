<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="workflow-title workflow-description" lang="en">
  <title id="workflow-title">Proposed import workflow: visible only after a confirmed commit</title>
  <desc id="workflow-description">Proposed import workflow, not implemented or live telemetry. Seven ordered stages: Receive original; Validate or quarantine; Extract candidates; Match and normalise; Owner preview and approval; Commit and financial audit; Durable receipt and reconciliation. Trace, source, status and cost evidence applies at every stage. Failed, cancelled or staged work has no financial visibility. Financial visibility is permitted only after a successful logical commit. Static PNG and SVG alternatives are available.</desc>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1600" height="880" rx="0" fill="#f8fafc" />
  <text x="48" y="60" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569" font-weight="700">MYPAISAA PREDICTION  /  IMPORT WORKFLOW</text>
  <text x="48" y="124" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#0f172a" font-weight="700">Visible only after a confirmed commit</text>
  <text x="48" y="169" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#475569">Private originals → reviewed candidates → auditable financial records</text>
  <rect x="1352" y="40" width="200" height="44" rx="22" fill="#fef3c7" />
  <text x="1452" y="69" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#78350f" font-weight="700" text-anchor="middle">PROPOSED</text>
  <polyline points="400,320 432,320" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrowhead)" />
  <polyline points="784,320 816,320" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrowhead)" />
  <polyline points="1168,320 1200,320" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrowhead)" />
  <polyline points="1376,424 1376,516" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrowhead)" />
  <polyline points="1200,620 1168,620" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrowhead)" />
  <polyline points="816,620 784,620" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrowhead)" />
  <g id="step-1" aria-label="Step 1: Receive original" />
  <rect x="48" y="216" width="352" height="208" rx="16" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2" />
  <rect x="48" y="216" width="352" height="8" rx="4" fill="#1d4ed8" />
  <rect x="68" y="240" width="42" height="38" rx="10" fill="#1d4ed8" />
  <text x="89" y="268" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
  <text x="68" y="316" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#0f172a" font-weight="700">Receive</text>
  <text x="68" y="345" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#0f172a" font-weight="700">original</text>
  <text x="68" y="379" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569">CSV / Excel / PDF</text>
  <text x="68" y="404" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569">Screenshot or manual</text>
  <g id="step-2" aria-label="Step 2: Validate / quarantine" />
  <rect x="432" y="216" width="352" height="208" rx="16" fill="#fff1f2" stroke="#9f1239" stroke-width="2" />
  <rect x="432" y="216" width="352" height="8" rx="4" fill="#9f1239" />
  <rect x="452" y="240" width="42" height="38" rx="10" fill="#9f1239" />
  <text x="473" y="268" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
  <text x="452" y="316" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#0f172a" font-weight="700">Validate /</text>
  <text x="452" y="345" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#0f172a" font-weight="700">quarantine</text>
  <text x="452" y="379" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569">Check type, size, scope</text>
  <text x="452" y="404" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569">Reject unsafe inputs</text>
  <g id="step-3" aria-label="Step 3: Extract candidates" />
  <rect x="816" y="216" width="352" height="208" rx="16" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2" />
  <rect x="816" y="216" width="352" height="8" rx="4" fill="#6d28d9" />
  <rect x="836" y="240" width="42" height="38" rx="10" fill="#6d28d9" />
  <text x="857" y="268" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
  <text x="836" y="316" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#0f172a" font-weight="700">Extract</text>
  <text x="836" y="345" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#0f172a" font-weight="700">candidates</text>
  <text x="836" y="379" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569">Capture field + source</text>
  <text x="836" y="404" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569">Treat text as untrusted</text>
  <g id="step-4" aria-label="Step 4: Match / normalise" />
  <rect x="1200" y="216" width="352" height="208" rx="16" fill="#ecfeff" stroke="#0e7490" stroke-width="2" />
  <rect x="1200" y="216" width="352" height="8" rx="4" fill="#0e7490" />
  <rect x="1220" y="240" width="42" height="38" rx="10" fill="#0e7490" />
  <text x="1241" y="268" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
  <text x="1220" y="316" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#0f172a" font-weight="700">Match /</text>
  <text x="1220" y="345" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#0f172a" font-weight="700">normalise</text>
  <text x="1220" y="379" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569">Resolve listing + units</text>
  <text x="1220" y="404" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569">Review uncertain values</text>
  <g id="step-5" aria-label="Step 5: Owner preview + approval" />
  <rect x="1200" y="516" width="352" height="208" rx="16" fill="#fffbeb" stroke="#92400e" stroke-width="2" />
  <rect x="1200" y="516" width="352" height="8" rx="4" fill="#92400e" />
  <rect x="1220" y="540" width="42" height="38" rx="10" fill="#92400e" />
  <text x="1241" y="568" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
  <text x="1220" y="616" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#0f172a" font-weight="700">Owner preview</text>
  <text x="1220" y="645" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#0f172a" font-weight="700">+ approval</text>
  <text x="1220" y="679" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569">Review exact draft</text>
  <text x="1220" y="704" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569">Bind scope + revision</text>
  <g id="step-6" aria-label="Step 6: Commit + financial audit" />
  <rect x="816" y="516" width="352" height="208" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="2" />
  <rect x="816" y="516" width="352" height="8" rx="4" fill="#047857" />
  <rect x="836" y="540" width="42" height="38" rx="10" fill="#047857" />
  <text x="857" y="568" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
  <text x="836" y="616" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#0f172a" font-weight="700">Commit +</text>
  <text x="836" y="645" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#0f172a" font-weight="700">financial audit</text>
  <text x="836" y="679" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569">One logical application</text>
  <text x="836" y="704" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569">Fence financial visibility</text>
  <g id="step-7" aria-label="Step 7: Durable receipt / reconcile" />
  <rect x="432" y="516" width="352" height="208" rx="16" fill="#f1f5f9" stroke="#334155" stroke-width="2" />
  <rect x="432" y="516" width="352" height="8" rx="4" fill="#334155" />
  <rect x="452" y="540" width="42" height="38" rx="10" fill="#334155" />
  <text x="473" y="568" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">7</text>
  <text x="452" y="616" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#0f172a" font-weight="700">Durable receipt</text>
  <text x="452" y="645" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#0f172a" font-weight="700">/ reconcile</text>
  <text x="452" y="679" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569">Recover the result</text>
  <text x="452" y="704" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475569">Check ledger + originals</text>
  <rect x="48" y="516" width="352" height="208" rx="16" fill="#fff1f2" stroke="#fda4af" stroke-width="2" />
  <text x="68" y="560" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#9f1239" font-weight="700">NO FINANCIAL VISIBILITY</text>
  <text x="68" y="602" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#881337">Failed, cancelled or</text>
  <text x="68" y="630" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#881337">staged work stays outside</text>
  <text x="68" y="658" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#881337">holdings, agents and totals.</text>
  <rect x="48" y="760" width="1504" height="56" rx="12" fill="#e2e8f0" />
  <text x="800" y="797" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#334155" font-weight="700" text-anchor="middle">Trace / source / status / cost evidence at every stage</text>
  <text x="48" y="858" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Static overview • Proposed workflow • Not implemented</text>
</svg>