  <text x="800" y="609.93" font-size="23" font-family="Arial, Helvetica, sans-serif" fill="#78350f" text-anchor="middle" font-weight="700">Planning allocation — not actual spend, a resource quote or permission to spend</text>
  <text x="48" y="683.29" font-size="19" font-family="Arial, Helvetica, sans-serif" fill="#475569" text-anchor="start">Proposed / not implemented • Full-scope pricing remains unvalidated • Source: confirmed DEC-023</text>
